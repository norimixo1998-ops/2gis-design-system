<!-- ============================================ -->
<!-- HEADER / TOP BAR -->
<!-- ============================================ -->
<!-- 
  Описание: Верхняя полоса с логотипом, поиском, 
  выбором языка и кнопками CTA.
  
  Параметры для замены:
  - {{LOGO_TEXT}} — текст логотипа (после иконки)
  - {{LOGO_LINK}} — ссылка логотипа (обычно "/")
  - {{SEARCH_PLACEHOLDER}} — текст в поле поиска
  - {{LANGUAGE}} — язык (RU, EN, и т.д.)
  - {{BTN_CONSULT_TEXT}} — текст первой кнопки
  - {{BTN_CONSULT_LINK}} — ссылка первой кнопки
  - {{BTN_APPLY_TEXT}} — текст второй кнопки (зелёная)
  - {{BTN_APPLY_LINK}} — ссылка второй кнопки
  
  Пример использования:
  {{LOGO_TEXT}} = "2ГИС"
  {{LOGO_LINK}} = "/"
  {{SEARCH_PLACEHOLDER}} = "Поиск"
  {{LANGUAGE}} = "RU"
  {{BTN_CONSULT_TEXT}} = "Получить консультацию"
  {{BTN_CONSULT_LINK}} = "/consult"
  {{BTN_APPLY_TEXT}} = "Оставить заявку"
  {{BTN_APPLY_LINK}} = "/apply"
-->

      <!-- Дополнительный текст логотипа (опционально) -->
      <span style="margin-left: var(--space-3); color: white; font-family: var(--font-display); font-size: 24px; font-weight: 700; display: none;">
        {{LOGO_TEXT}}
      </span>
    </a>
    
    <!-- Правая часть: поиск, язык, кнопки -->
    <div style="display: flex; align-items: center; gap: var(--space-8);">
      
      <!-- Поиск -->
      <div style="display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-2); background: rgba(255, 255, 255, 0.12); border-radius: var(--radius-4);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0;">
          <circle cx="11" cy="11" r="7" stroke="rgba(255, 255, 255, 0.64)" stroke-width="2"/>
          <path d="M20 20L16.5 16.5" stroke="rgba(255, 255, 255, 0.64)" stroke-width="2"/>
        </svg>
        <span style="color: rgba(255, 255, 255, 0.64); font-family: var(--font-primary); font-size: 14px; font-weight: 400; line-height: 20px;">
          {{SEARCH_PLACEHOLDER}}
        </span>
      </div>
      
      <!-- Выбор языка -->
      <div style="display: flex; align-items: center; gap: var(--space-1);">
        <span style="color: white; font-family: var(--font-primary); font-size: 16px; font-weight: 400; line-height: 24px;">
          {{LANGUAGE}}
        </span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0;">
          <path d="M6 9L12 15L18 9" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      
      <!-- Кнопки -->
      <div style="display: flex; align-items: center; gap: var(--space-3);">
        
        <!-- Кнопка 1 (вторичная) -->
        <a href="{{BTN_CONSULT_LINK}}" style="height: 48px; padding: var(--space-3) var(--space-7); background: rgba(255, 255, 255, 0.12); border-radius: var(--radius-4); display: flex; align-items: center; text-decoration: none;">
          <span style="color: white; font-family: var(--font-primary); font-size: 16px; font-weight: 500; line-height: 24px;">
            {{BTN_CONSULT_TEXT}}
          </span>
        </a>
        
        <!-- Кнопка 2 (первичная, зелёная) -->
        <a href="{{BTN_APPLY_LINK}}" style="height: 48px; padding: var(--space-3) var(--space-4); background: var(--color-primary); border-radius: var(--radius-4); display: flex; align-items: center; text-decoration: none;">
          <span style="color: white; font-family: var(--font-primary); font-size: 16px; font-weight: 500; line-height: 24px;">
            {{BTN_APPLY_TEXT}}
          </span>
        </a>
        
      </div>
    </div>
    
  </div>
</header>

<!-- Адаптивность -->

  @media (max-width: 1024px) {
    .site-header .container {
      flex-wrap: wrap;
      gap: var(--space-4);
    }
    
    .site-header > div > div:last-child {
      flex-wrap: wrap;
      justify-content: center;
    }
  }
  
  @media (max-width: 768px) {
    .site-header {
      padding: var(--space-3) var(--space-4);
    }
    
    .logo svg {
      width: 56px;
      height: 56px;
    }
    
    .logo span {
      display: none;
    }
    
    .site-header > div > div:last-child {
      flex-direction: column;
      width: 100%;
    }
  }
</style>
